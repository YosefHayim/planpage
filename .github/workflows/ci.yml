name: CI

# Lint and typecheck run in the pre-push hook (.husky/pre-push), not here.
# E2E is opt-in: there is no test:e2e script yet. Add one, then add an e2e job
# that calls ./.github/workflows/e2e.yml and list it in the gate's needs.
# Runs only after a merge to main, never on pull requests.

'on':
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Test and build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm build
  gate:
    name: CI Gate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs:
      - verify
    if: always()
    steps:
      - name: Require every check to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
  report-failure:
    name: Open issue on main failure
    needs:
      - verify
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/report-failure.yml
