name: CI

# Lint and typecheck run in the pre-push hook (.husky/pre-push), not here.
# E2E is opt-in: there is no test:e2e script yet. Add one, then add an e2e job
# that calls ./.github/workflows/e2e.yml and list it in the gate's needs.

'on':
  pull_request:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      since: ${{ steps.filter.outputs.everything != 'true' && github.event.pull_request.base.sha || '' }}
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ''
          filters: |
            everything: &everything
              - pnpm-lock.yaml
              - package.json
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - '.github/**'
            code:
              - *everything
              - 'src/**'
              - 'public/**'
              - 'skills/**'
  verify:
    name: Test and build
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run tests
        if: needs.changes.outputs.since == ''
        run: pnpm test
      - name: Run tests (changed files)
        if: needs.changes.outputs.since != ''
        env:
          SINCE: ${{ needs.changes.outputs.since }}
        run: pnpm exec vitest run --changed "$SINCE"
      - name: Build
        run: pnpm build
  gate:
    name: CI Gate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs:
      - changes
      - verify
    if: always()
    steps:
      - name: Require every check to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
