name: Test

# Single-purpose, reusable (workflow_call): the unified vitest suite (workerd D1
# route handlers + node/effect domain tests) via `alg test`. alg targets Node 24+
# (uses `node:sqlite`), so this pins Node 24 rather than a legacy matrix.

on:
  workflow_call:
    inputs:
      since:
        description: Base commit to test changes against. Empty runs everything.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: ubuntu / node 24
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: inputs.since == ''
        run: pnpm test

      - name: Run tests (changed files)
        if: inputs.since != ''
        env:
          SINCE: ${{ inputs.since }}
        run: pnpm exec vitest run --changed "$SINCE"
