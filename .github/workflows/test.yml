name: Test
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  test:
    name: ubuntu / node 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Install Linux browser opener
        run: |
          command -v xdg-open >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xdg-utils
          }
      - name: Run tests
        run: pnpm test
    timeout-minutes: 20
