name: E2E

# Single-purpose, reusable (workflow_call): the end-to-end suite. OPT-IN — it
# ships as a template but is NOT wired into ci.yml, because alg has no `test:e2e`
# script yet (it would run red). Once you add one, uncomment the `e2e:` job in
# ci.yml (`uses: ./.github/workflows/e2e.yml`) and the Chromium install step below
# (alg's scanner drives Playwright, so real E2E needs a browser).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E tests
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup

      # Playwright: install the browser before the suite.
      # - name: Install Playwright browsers
      #   run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run E2E tests
        run: pnpm test:e2e
