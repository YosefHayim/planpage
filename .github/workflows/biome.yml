name: Biome

# Single-purpose, reusable (workflow_call): lint + format in one pass. Biome does
# both, so there is no separate lint/format workflow. Deterministic across OS/Node,
# so it runs single-leg (ubuntu, one Node) — no matrix.

on:
  workflow_call:
    inputs:
      since:
        description: Base commit to lint changes against. Empty lints everything.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  biome:
    name: Lint & format (biome ci)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format (biome ci, all files)
        if: inputs.since == ''
        run: pnpm run check:ci

      - name: Lint & format (biome ci, changed files)
        if: inputs.since != ''
        env:
          SINCE: ${{ inputs.since }}
        run: pnpm exec biome ci --changed --since="$SINCE" --no-errors-on-unmatched
